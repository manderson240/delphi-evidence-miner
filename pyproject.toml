[project]
name = "delphi-evidence-miner"
version = "0.2.0"
description = "Autonomous LMSR Information-Gain & Sheaf-Verified Evidence Mining Agent for Gensyn Delphi Markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
delphi-miner = "delphi_miner.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delphi_miner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
